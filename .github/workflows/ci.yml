name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check dependency advisories
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Install browser for UI checks
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Check development and production in the browser
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: node scripts/browser-verify.mjs
      - name: Upload browser evidence
        if: always() && matrix.node == 24 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}
          path: screenshots
          retention-days: 14
